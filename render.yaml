# Render Blueprint (pulsuz plan). Heç bir gizli dəyər repoda yoxdur:
# baza bağlantısı Render tərəfindən avtomatik verilir, admin parolu Render tərəfindən yaradılır
# (Render → muellim-komekcisi → Environment → MK_ADMIN_PASSWORD).
databases:
  - name: muellim-db
    plan: free
    region: frankfurt
    databaseName: muellim
    user: muellim
services:
  - type: web
    name: muellim-komekcisi
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MK_DATABASE_URL          # Neon (pulsuz, müddətsiz) – dəyər Render panelində (repoya yazılmır)
        sync: false
      - key: MK_SECRET_KEY
        generateValue: true
      - key: MK_ADMIN_PASSWORD        # ilk açılışda admin (hesenov.ferid) bu parolla yaradılır
        generateValue: true
      - key: MK_COOKIE_SECURE
        value: "true"
      - key: MK_STORAGE               # db – fayllar bazada (silinmir); Google Drive qoşulanda: gdrive
        value: db
      - key: MK_BANK_SYNC_MINUTES
        value: "60"
