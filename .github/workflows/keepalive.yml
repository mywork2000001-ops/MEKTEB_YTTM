# Ehtiyat oyadıcı: səhər 07:00-da (Bakı) yatmış serveri oyadır; gündüz server özü özünü oyaq saxlayır (scheduler).
# 07:00–23:00 Bakı = 03:00–19:00 UTC. Gecə oyadılmır. Repo variable: RENDER_URL.
name: keepalive
on:
  schedule:
    - cron: '*/10 3-18 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          if [ -z "${{ vars.RENDER_URL }}" ]; then echo "RENDER_URL yoxdur"; exit 0; fi
          curl -fsS --max-time 90 --retry 3 --retry-delay 15 "${{ vars.RENDER_URL }}/api/health"
