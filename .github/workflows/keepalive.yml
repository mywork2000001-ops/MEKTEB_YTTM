# Render pulsuz planı 15 dəqiqə istifadəsiz qalanda yatır – hər 10 dəqiqədə bir yoxlama onu oyaq saxlayır.
# Repo → Settings → Secrets and variables → Actions → Variables: RENDER_URL = https://....onrender.com
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          if [ -z "${{ vars.RENDER_URL }}" ]; then echo "RENDER_URL təyin edilməyib"; exit 0; fi
          curl -fsS --max-time 60 --retry 3 --retry-delay 10 "${{ vars.RENDER_URL }}/api/health"
